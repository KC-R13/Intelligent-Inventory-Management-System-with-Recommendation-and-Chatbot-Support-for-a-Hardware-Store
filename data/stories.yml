version: "3.1"

stories:
  - story: greet and browse
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_products
      - action: action_list_categories

  - story: check product availability
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_availability
      - action: action_check_availability

  - story: ask price directly
    steps:
      - intent: ask_price
      - action: action_check_price

  - story: browse by category then ask price
    steps:
      - intent: ask_category
      - action: action_list_products_by_category
      - intent: ask_price
      - action: action_check_price

  - story: search product
    steps:
      - intent: search_product
      - action: action_search_product

  - story: check stock level
    steps:
      - intent: check_stock_level
      - action: action_check_stock_level

  - story: availability then price
    steps:
      - intent: ask_availability
      - action: action_check_availability
      - intent: ask_price
      - action: action_check_price

  - story: help flow
    steps:
      - intent: ask_help
      - action: utter_help
      - intent: ask_availability
      - action: action_check_availability

  - story: goodbye flow
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - story: product details
    steps:
      - intent: ask_product_details
      - action: action_search_product
      - intent: ask_price
      - action: action_check_price
      - intent: goodbye
      - action: utter_goodbye
