version: "3.1"

intents:
  - greet
  - goodbye
  - ask_products
  - ask_availability
  - ask_product_details
  - search_product
  - ask_help
  - bot_challenge

entities:
  - product_name
  - category
  - quantity

slots:
  product_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_name

  category:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: category

  quantity:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: quantity

responses:
  utter_greet:
    - text: "Welcome to **Hardware Store**! I'm your chatbot assistant.\n\nI can help you with:\n• Searching for products\n• Checking availability & stock\n• Getting pricing information\n\nWhat can I help you find today?"

  utter_goodbye:
    - text: "Thanks for! 🔨 Come back anytime. Have a great project!"

  utter_iamabot:
    - text: "I'm your chatbot assistant."

  utter_help:
    - text: "Here's what I can do for you:\n\n **Find Products** — 'Do you have circular saws?'\n **Stock Info** — 'Is cement available?'\n🗂 **Browse Categories** — 'Show me electrical supplies'\n **Product Details** — 'Tell me about the DeWalt drill'"

actions:
  - action_search_product
  - action_check_availability
  - action_list_products

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
