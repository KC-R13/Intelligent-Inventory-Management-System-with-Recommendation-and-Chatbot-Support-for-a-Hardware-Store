<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot — Inventory Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e2e0d8;
    --accent: #c8501a;
    --text: #1a1916;
    --muted: #9a9690;
    --bot-bg: #ffffff;
    --user-bg: #1a1916;
    --user-text: #f5f4f0;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    background: var(--bg);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chat-window {
    width: 100%;
    max-width: 480px;
    height: 92vh;
    max-height: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  /* HEADER */
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }

  .header-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .header-title span {
    color: var(--accent);
  }

  .header-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .online-dot {
    margin-left: auto;
    width: 7px;
    height: 7px;
    background: #22c55e;
    border-radius: 50%;
    flex-shrink: 0;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-row {
    display: flex;
    animation: fadeUp 0.18s ease;
  }

  .msg-row.user { justify-content: flex-end; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .bubble.bot {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 3px;
  }

  .bubble.user {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 3px;
  }

  .bubble.error {
    background: #fff5f5;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-family: var(--mono);
    font-size: 12px;
  }

  /* TYPING */
  .typing-row {
    display: none;
    padding: 0 20px 4px;
  }

  .typing-row.show { display: flex; }

  .typing-bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    border-bottom-left-radius: 3px;
    padding: 11px 14px;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .dot {
    width: 5px; height: 5px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.16s; }
  .dot:nth-child(3) { animation-delay: 0.32s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-4px); }
  }

  /* INPUT */
  .input-area {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    gap: 8px;
  }

  input[type=text] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 9px 12px;
    transition: border-color 0.15s;
  }

  input[type=text]::placeholder { color: var(--muted); }

  input[type=text]:focus {
    border-color: var(--accent);
  }

  button {
    padding: 9px 16px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  button:hover  { opacity: 0.88; }
  button:active { opacity: 0.75; }
</style>
</head>
<body>
<div class="chat-window">

  <div class="header">
    <div class="header-title">Build<span>Pro</span> Assistant</div>
    <div class="header-sub">Inventory</div>
    <div class="online-dot"></div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-row">
      <div class="bubble bot">Welcome to BuildPro. Ask me about products, prices, or stock availability.</div>
    </div>
  </div>

  <div class="typing-row" id="typingRow">
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="msgInput" placeholder="Ask about products, prices, availability…" autocomplete="off">
    <button onclick="handleSend()">Send</button>
  </div>

</div>

<script>
  const RASA_URL = 'http://localhost:5005/webhooks/rest/webhook';
  const SENDER   = 'user_' + Math.random().toString(36).slice(2, 8);

  async function sendMsg(text) {
    if (!text.trim()) return;

    addBubble(text, 'user');
    document.getElementById('msgInput').value = '';
    document.getElementById('typingRow').className = 'typing-row show';

    try {
      const res  = await fetch(RASA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: SENDER, message: text })
      });
      const data = await res.json();
      document.getElementById('typingRow').className = 'typing-row';

      if (data.length === 0) {
        addBubble("Sorry, I didn't understand that. Please try again.", 'bot');
      } else {
        data.forEach(msg => { if (msg.text) addBubble(msg.text, 'bot'); });
      }
    } catch (err) {
      document.getElementById('typingRow').className = 'typing-row';
      addBubble('Could not reach Rasa server.\nMake sure both servers are running:\n  uv run rasa run actions\n  uv run rasa run --enable-api --cors "*"', 'error');
    }
  }

  function addBubble(text, type) {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `msg-row${type === 'user' ? ' user' : ''}`;

    const bubble = document.createElement('div');
    bubble.className = `bubble ${type}`;
    bubble.textContent = text;

    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function handleSend() {
    sendMsg(document.getElementById('msgInput').value.trim());
  }

  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSend();
  });
</script>
</body>
</html>
