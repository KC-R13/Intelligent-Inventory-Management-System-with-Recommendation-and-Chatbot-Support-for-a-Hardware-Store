version: "3.1"

rules:
  - rule: Say hello
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Help request
    steps:
      - intent: ask_help
      - action: utter_help

  - rule: List products
    steps:
      - intent: ask_products
      - action: action_list_products

  - rule: Check availability
    steps:
      - intent: ask_availability
      - action: action_check_availability

  - rule: Search product
    steps:
      - intent: search_product
      - action: action_search_product

  - rule: Product details
    steps:
      - intent: ask_product_details
      - action: action_search_product
