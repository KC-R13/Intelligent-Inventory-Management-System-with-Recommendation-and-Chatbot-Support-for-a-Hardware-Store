version: "3.1"

stories:
  - story: greet and browse
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_products
      - action: action_list_products

  - story: check product availability
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_availability
      - action: action_check_availability

  - story: search product
    steps:
      - intent: search_product
      - action: action_search_product

  - story: availability then price
    steps:
      - intent: ask_availability
      - action: action_check_availability

  - story: help flow
    steps:
      - intent: ask_help
      - action: utter_help
      - intent: ask_availability
      - action: action_check_availability

  - story: goodbye flow
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - story: product details
    steps:
      - intent: ask_product_details
      - action: action_search_product
      - intent: goodbye
      - action: utter_goodbye
